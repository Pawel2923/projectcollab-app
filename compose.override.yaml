services:
  api:
    build:
      context: ./api
      dockerfile: ../.docker/api/Dockerfile.dev
      target: frankenphp_dev
      additional_contexts:
        frankenphp: ./.docker/frankenphp
        spa: ./spa
    volumes:
      - ./api:/app
      - /app/var
      - .:/workspace:cached
      - ./spa/dist:/app/public/spa:ro
      - ./.docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro 
      - ./.docker/frankenphp/conf.d/app.dev.ini:/usr/local/etc/php/conf.d/app.dev.ini:ro
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      MAILER_DSN: smtp://localhost:1025
      MERCURE_EXTRA_DIRECTIVES: playground
    extra_hosts:
      - host.docker.internal:host-gateway
    stdin_open: true
    tty: true
    healthcheck:
      disable: true

  frontend:
    build:
      context: ./frontend
      dockerfile: ../.docker/frontend/Dockerfile.dev
      target: dev
    volumes:
      - ./frontend:/app
      - ./frontend/node_modules:/app/node_modules
      - .:/workspace:cached
    environment:
      WATCHPACK_POLLING: "true"
    stdin_open: true
    tty: true

  database:
    ports:
      - target: 5432
        published: ${DATABASE_PORT:-5432}
        protocol: tcp

  mailer:
    image: schickling/mailcatcher
    ports:
      - "${MAILER_SMTP_PORT:-1025}:1025"
      - "${MAILER_WEB_PORT:-44949}:1080"
